  <g transform="translate(510,320)"><rect width="230" height="130" rx="26" fill="#eff6ff"/><text x="28" y="55" font-size="38">🚗</text><text x="28" y="98" font-size="24">Car ride</text></g>
  <g transform="translate(760,320)"><rect width="230" height="130" rx="26" fill="#ecfeff"/><text x="28" y="55" font-size="38">🌧</text><text x="28" y="98" font-size="24">Rainy day</text></g>
  <g transform="translate(1010,320)"><rect width="230" height="130" rx="26" fill="#fff7ed"/><text x="28" y="55" font-size="38">😭</text><text x="28" y="98" font-size="24">Fussy moment</text></g>
  <g transform="translate(260,475)"><rect width="230" height="130" rx="26" fill="#fefce8"/><text x="28" y="55" font-size="38">⚡</text><text x="28" y="98" font-size="23">Burn energy</text></g>
  <g transform="translate(510,475)"><rect width="230" height="130" rx="26" fill="#fdf2f8"/><text x="28" y="55" font-size="38">❤️</text><text x="28" y="91" font-size="21">Parent &amp; baby</text><text x="28" y="116" font-size="21">bonding</text></g>
  <g transform="translate(760,475)"><rect width="230" height="130" rx="26" fill="#f0fdf4"/><text x="28" y="55" font-size="38">🧹</text><text x="28" y="98" font-size="22">Clean-up time</text></g>
  <g transform="translate(1010,475)"><rect width="230" height="130" rx="26" fill="#faf5ff"/><text x="28" y="55" font-size="38">🎉</text><text x="28" y="91" font-size="21">Just want</text><text x="28" y="116" font-size="21">to play</text></g>
